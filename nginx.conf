# supersaw — static SPA. Runs under Network=host on the Pi, so the listen port
# is the host port (family convention: one fixed port per service, see ../raspi).
server {
    listen 3013;
    server_name _;
    root /usr/share/nginx/html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # House security headers. CSP allows self + the Google Fonts pair pulled in
    # by halo.css; SvelteKit injects inline style tags, hence style 'unsafe-inline'.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # Unauthenticated liveness for gatus (bypasses oauth2-proxy at the edge).
    location = /status {
        default_type text/plain;
        return 200 'ok';
    }

    # Caching via `expires` (not add_header): an add_header inside a location
    # would discard the inherited server-level security headers above.
    # Hashed build assets are immutable-in-practice.
    location /_app/ {
        expires max;
        try_files $uri =404;
    }

    # SPA fallback: adapter-static emits only index.html in pure-SPA mode;
    # every client route resolves to it. Never cache the shell.
    location / {
        expires epoch;
        try_files $uri /index.html;
    }
}
